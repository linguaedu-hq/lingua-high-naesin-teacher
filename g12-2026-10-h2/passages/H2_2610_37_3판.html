올 수 있다."},{"n":10,"en":"This example illustrates how reappraisal might powerfully transform short-term emotional responses.","ko":"이 예는 재평가가 짧은 동안의 감정 반응을 어떻게 강력하게 바꾸어 놓을 수 있는지 보여 준다."},{"n":11,"en":"When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people’s psychological health.","ko":"되풀이되면 재평가가 낳은 이런 짧은 감정 결과가 쌓여 사람들의 심리적 건강을 만들어 갈 수 있다."},{"n":12,"en":"Thereby, reappraisal might be a key to resilience.","ko":"그렇게 하여 재평가는 회복력을 기르는 열쇠가 될 수 있다."}],"topic":1,"gist":12,"hl":[{"sent":1,"text":"emotions at their root"},{"sent":9,"text":"it might also bring some positive emotions"},{"sent":12,"text":"reappraisal might be a key to resilience"}],"con":[{"sent":3,"text":"and yet","rel":"역접"},{"sent":5,"text":"Alternatively","rel":"대조"},{"sent":6,"text":"As a result","rel":"결과"},{"sent":9,"text":"Crucially","rel":"첨가"},{"sent":12,"text":"Thereby","rel":"결과"}],"ref":[{"sent":3,"text":"This","occ":0,"to_sent":2,"to":"a divorce","ko":"이혼"},{"sent":4,"text":"it","occ":0,"to_sent":2,"to":"a divorce","ko":"이혼"},{"sent":6,"text":"these different construals","occ":0,"to_sent":4,"to":"an overpowering loss","ko":"이혼을 보는 두 가지 해석"},{"sent":9,"text":"it","occ":0,"to_sent":8,"to":"The second construal","ko":"두 번째 해석"},{"sent":10,"text":"This example","occ":0,"to_sent":2,"to":"someone who is going through a divorce","ko":"이혼을 겪는 사람의 예"},{"sent":11,"text":"these short-term emotional consequences","occ":0,"to_sent":10,"to":"short-term emotional responses","ko":"짧은 동안의 감정 반응"}],"grammar":[{"id":"g1","sent":1,"pos":12,"text":"―changing","cat":"동명사","chip":"동명사","right":"―changing","wrong":["―changed"],"rule":"대시 사이 어구가 Reappraisal 이 무엇인지 풀어 쓰는 명사 역할이므로 동명사 changing 을 쓴다.","imp":0,"deck":false},{"id":"g2","sent":1,"pos":114,"text":"to regulating","cat":"동명사","chip":"동명사","right":"to regulating","wrong":["to regulate"],"rule":"avenue to 의 to 는 '~로 가는'이라는 뜻의 전치사라 뒤에 동명사 regulating 을 쓴다.","imp":0,"deck":false},{"id":"g3","sent":1,"pos":148,"
