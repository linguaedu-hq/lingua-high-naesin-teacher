<script>window.DECK3={"meta":{"id":"H1_2410_34","grade":"고1","year":2024,"month":10,"item_no":34,"orig_type":"빈칸","words":161,"exam":"2024학년도 10월 전국연합학력평가 고1 영어","topic_ko":"기후 위기의 일상화에 따른 기후 픽션 장르의 쇠퇴","title_ko":"이야기가 될 수 없는 기후 위기","title_en":"When Climate Change Stops Being a Story","gist_ko":"기후 변화가 누구도 피할 수 없는 일상이 되면 기후 픽션은 남의 일을 다룬 이야기로서 힘을 잃는다."},"kind":"normal","boards":[{"key":"topic","no":"①","name":"주제문","full":"① 주제문 판"},{"key":"gram","no":"②","name":"어법 · 어휘","full":"② 어법 · 어휘 판"},{"key":"all","no":"③","name":"전체","full":"③ 전체 판"}],"sents":[{"n":1,"en":"On-screen, climate disaster is everywhere you look, but the scope of the world’s climate transformation may just as quickly eliminate the climate-fiction genre ― indeed eliminate any effort to tell the story of warming, which could grow too large and too obvious even for Hollywood.","ko":"화면 속 어디를 보아도 기후 재난이 가득하지만, 세계 기후가 바뀌는 규모 때문에 기후 픽션 장르도 그만큼 빠르게 사라질 수 있고, 실은 온난화를 이야기로 들려주려는 모든 노력이 사라질 수도 있다. 온난화는 할리우드가 다루기에도 너무 거대하고 너무 뻔한 일이 될 수 있기 때문이다."},{"n":2,"en":"You can tell stories ‘about’ climate change while it still seems a marginal feature of human life.","ko":"기후 변화가 아직 사람들 삶의 변두리 일로 보이는 동안에는 기후 변화를 ‘다룬’ 이야기를 들려줄 수 있다."},{"n":3,"en":"But when the temperature rises by three or four more degrees, hardly anyone will be able to feel isolated from its impacts.","ko":"그러나 기온이 3~4도 더 오르면 그 영향에서 동떨어져 있다고 느낄 수 있는 사람은 거의 없게 된다."},{"n":4,"en":"And so as climate change expands across the horizon, it may cease to be a story.","ko":"그래서 기후 변화가 시야 끝까지 온통 번져 가면 기후 변화는 더 이상 이야기로 남지 못할 수 있다."},{"n":5,"en":"Why watch or read climate fiction about the world you can see plainly out your own window?","ko":"자기 집 창밖으로 뻔히 보이는 세상을 다룬 기후 픽션을 굳이 보거나 읽을 까닭이 있겠는가?"},{"n":6,"en":"At the moment, stories illustrating global warming can still offer an escapist pleasure, even if that pleasure often comes in the form of horror.","ko":"그 즐거움이 흔히 공포의 모습으로 찾아오기는 해도, 지금으로서는 지구 온난화를 그린 이야기가 여전히 현실을 잊게 하는 즐거움을 줄 수 있다."},{"n":7,"en":"But when we can no longer pretend that climate suffering is distant — in time or in place ― we will stop pretending about it and start pretending within it.","ko":"그러나 기후로 인한 고통이 시간으로나 장소로나 먼 일이라고 더는 꾸며 댈 수 없게 되면, 우리는 그 고통을 소재로 꾸며 내기를 멈추고 그 고통 한가운데서 꾸며 내기 시작하게 된다."}],"topic":4,"gist":7,"hl":[{"sent":1,"text":"may just as quickly eliminate the climate-fiction genre"},{"sent":2,"text":"while it still seems a marginal feature of human life"},{"sent":3,"text":"hardly anyone will be able to feel isolated from its impacts"},{"sent":4,"text":"it may cease to be a story"},{"sent":5,"text":"the world you can see plainly out your own window"},{"sent":6,"text":"can still offer an escapist pleasure"},{"sent":7,"text":"we will stop pretending about it and start pretending within it"}],"con":[{"sent":1,"text":"but","rel":"역접"},{"sent":3,"text":"But","rel":"역접"},{"sent":4,"text":"And so","rel":"결과"},{"sent":7,"text":"But","rel":"역접"}],"ref":[{"sent":2,"text":"it","occ":0,"to_sent":2,"to":"climate change","ko":"기후 변화"},{"sent":3,"text":"its","occ":0,"to_sent":2,"to":"climate change","ko":"기후 변화"},{"sent":4,"text":"it","occ":0,"to_sent":4,"to":"climate change","ko":"기후 변화"},{"sent":7,"text":"it","occ":0,"to_sent":7,"to":"climate suffering","ko":"기후로 인한 고통"}],"grammar":[{"id":"g1","sent":1,"pos":28,"text":"is","cat":"동사 수 일치","chip":"수일치","right":"is","wrong":["are"],"rule":"주어 climate disaster 가 단수이므로 is 를 쓴다.","imp":0,"deck":true},{"id":"g2","sent":1,"pos":190,"text":"to tell","cat":"to부정사","chip":"to부정사","right":"to tell","wrong":["telling"],"rule":"to부정사 to tell 이 명사 effort 를 뒤에서 꾸며 「들려주려는 노력」을 나타낸다.","imp":0,"deck":false},{"id":"g3","sent":1,"pos":220,"text":"which","cat":"관계대명사","chip":"관계사","right":"which","wrong":["what"],"rule":"쉼표 뒤에서 앞의 warming 을 받아 덧붙여 설명하므로 계속적 용법 관계대명사 which 를 쓴다.","imp":0,"deck":false},{"id":"g4","sent":2,"pos":59,"text":"seems","cat":"동사 수 일치","chip":"수일치","right":"seems","wrong":["seem"],"rule":"while 절의 주어 it 이 단수이므로 seems 를 쓴다.","imp":0,"deck":false},{"id":"g
