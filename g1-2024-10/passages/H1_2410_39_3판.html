ions at the physiological and symptomatic levels are often strikingly similar.","ko":"건강과 질병에도 이 점이 들어맞는다는 것을 우리는 보게 될 텐데, 병의 원인은 많아도 생리적 수준과 증상 수준에서 드러나는 모습은 놀라울 만큼 비슷할 때가 많다."}],"topic":3,"gist":3,"hl":[{"sent":1,"text":"there’s a lot going on"},{"sent":2,"text":"the number of possible interactions between different molecules is enormous"},{"sent":3,"text":"can only hope to be stable if only a smaller number of collective ways of being may emerge"},{"sent":4,"text":"only a limited number of tissues and body shapes"},{"sent":5,"text":"this drastic narrowing of outcomes canalization"},{"sent":6,"text":"can’t exist in random states in between them"},{"sent":7,"text":"their manifestations at the physiological and symptomatic levels are often strikingly similar"}],"con":[{"sent":4,"text":"For example","rel":"예시"},{"sent":6,"text":"but","rel":"역접"},{"sent":7,"text":"but","rel":"역접"}],"ref":[{"sent":1,"text":"their","occ":0,"to_sent":1,"to":"physicists","ko":"물리학자들"},{"sent":3,"text":"Such a system","occ":0,"to_sent":1,"to":"high-dimensional system","ko":"생명과 같은 고차원 시스템"},{"sent":5,"text":"this drastic narrowing of outcomes","occ":0,"to_sent":4,"to":"only a limited number of tissues and body shapes","ko":"배아에서 한정된 조직과 몸 형태만 생겨나는 일"},{"sent":6,"text":"them","occ":0,"to_sent":6,"to":"well-defined possible states","ko":"뚜렷이 정해진 몇 가지 상태"},{"sent":7,"text":"this","occ":0,"to_sent":6,"to":"a small number of well-defined possible states","ko":"몇 가지 정해진 상태로만 좁혀지는 현상"},{"sent":7,"text":"their","occ":0,"to_sent":7,"to":"many causes of illness","ko":"병의 여러 원인"}],"grammar":[{"id":"g1","sent":1,"pos":8,"text":"what","cat":"관계대명사","chip":"관계사","right":"what","wrong":["that"],"rule":"앞에 선행사가 없고 call 의 목적어가 빠진 절을 이끌므로 관계대명사 what 을 쓴다.","imp":0,"deck":true},{"id":"g2","sent":1,"pos":64,"text":"which","cat":"관계대명사","chip":"관계사","right":"which","wrong":["what"],"rule":"쉼표 뒤에서 앞의 말을 받아 덧붙이는 계속적 용법이라 which 를 쓴다. what 은 쉼표 뒤에 쓰지 않는다.","imp":0,"deck":false},{"id":"g3","sent":1,"pos":92,"text":
