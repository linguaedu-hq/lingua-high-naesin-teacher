<script>window.DECK3={"meta":{"id":"H1_2506_43","grade":"고1","year":2025,"month":6,"item_no":43,"exam":"2025학년도 6월 전국연합학력평가 고1 영어","topic_ko":"낯선 이의 작은 친절이 데이나의 삶에 가져온 변화","title_ko":"우산 하나가 바꾼 삶","title_en":"One Umbrella, Many Lives Changed","gist_ko":"비 오는 날 낯선 사람 베키에게서 우산을 받은 데이나는 면접에 붙어 꿈을 이루었고, 그 친절을 잊지 않고 다른 사람들에게 이어 갔다."},"kind":"long","boards":[{"key":"topic","no":"①","name":"주제문","full":"① 주제문 판"},{"key":"gram","no":"②","name":"어법 · 어휘","full":"② 어법 · 어휘 판"},{"key":"all","no":"③","name":"전체","full":"③ 전체 판"}],"sents":[{"n":1,"en":"The sun shone in the cloudless sky as Becky, a retired teacher, walked to the fruit market.","ko":"은퇴한 교사 베키가 과일 시장으로 걸어갈 때, 구름 한 점 없는 하늘에 해가 빛났다."},{"n":2,"en":"Across town, Dana was riding a bus towards the museum for a job interview.","ko":"시내 반대편에서 데이나는 취업 면접을 보러 박물관으로 가는 버스를 타고 있었다."},{"n":3,"en":"Just before reaching her stop, Dana noticed the sky had suddenly darkened.","ko":"버스 정류장에 닿기 직전, 데이나는 하늘이 순식간에 어두워진 것을 깨달았다."},{"n":4,"en":"Her heart sank — she had no umbrella.","ko":"데이나는 가슴이 철렁했다. 우산이 없었던 것이다."},{"n":5,"en":"As she stepped off the bus next to the market, where Becky had just finished shopping, raindrops began to fall.","ko":"베키가 막 장보기를 마친 시장 옆에서 데이나가 버스에서 내리자 빗방울이 떨어지기 시작했다."},{"n":6,"en":"Dana felt panic.","ko":"데이나는 겁이 났다."},{"n":7,"en":"She didn’t want to show up to her interview soaked.","ko":"데이나는 비에 흠뻑 젖은 채로 면접을 보러 가고 싶지 않았다."},{"n":8,"en":"She looked around but couldn’t find any stores nearby to buy an umbrella, and she didn’t have time to search around.","ko":"데이나는 주위를 둘러보았지만 근처에서 우산을 살 가게를 찾을 수 없었고, 이리저리 찾아다닐 시간도 없었다."},{"n":9,"en":"Just then, Becky approached her, holding an open umbrella in one hand and a closed one in the other.","ko":"바로 그때 베키가 데이나에게 다가왔는데, 펼친 우산 하나는 한 손에, 접은 우산 하나는 다른 손에 들고 있었다."},{"n":10,"en":"“Take this,” she said with a smile.","ko":"“이걸 받으세요.” 베키가 웃으며 말했다."},{"n":11,"en":"Dana’s eyes widened.","ko":"데이나는 눈이 휘둥그레졌다."},{"n":12,"en":"“Are you sure?”","ko":"“정말 괜찮으세요?”"},{"n":13,"en":"Becky nodded.","ko":"베키는 고개를 끄덕였다."},{"n":14,"en":"“I always carry an extra on rainy days.”","ko":"“저는 비 오는 날에는 늘 여분을 하나 가지고 다녀요.”"},{"n":15,"en":"Dana thanked her, took the umbrella, and opened it.","ko":"데이나는 베키에게 고맙다고 인사하고 우산을 받아 펼쳤다."},{"n":16,"en":"She saw a small card tied to the handle.","ko":"데이나는 손잡이에 작은 카드가 묶여 있는 것을 보았다."},{"n":17,"en":"It read: “Cover each other.”","ko":"카드에는 “서로를 감싸 주세요.”라고 쓰여 있었다."},{"n":18,"en":"She was touched by the message.","ko":"데이나는 그 글귀에 감동했다."},{"n":19,"en":"She hurried to the museum, arriving dry and comfortable, and performed well in her interview.","ko":"데이나는 서둘러 박물관으로 가서 젖지 않은 채 편안하게 도착했고, 면접을 잘 치렀다."},{"n":20,"en":"The Museum CEO was impressed by Dana and offered her the Event Manager position, her dream job.","ko":"박물관 대표는 데이나에게 깊은 인상을 받아, 데이나가 꿈꾸던 직업인 행사 매니저 직책을 제안했다."},{"n":21,"en":"Throughout the years ahead, she often thought back to Becky’s kind gesture.","ko":"그 뒤 여러 해 동안 데이나는 베키의 친절한 행동을 자주 떠올렸다."},{"n":22,"en":"Inspired by the memory, Dana created a museum event called “Cover Each Other” with paintings of people supporting others.","ko":"그 기억에 영감을 받아, 데이나는 남을 돕는 사람들을 그린 그림들로 “서로를 감싸 주세요”라는 박물관 행사를 만들었다."},{"n":23,"en":"She donated half of the money from ticket sales to families who lost their homes to natural disasters.","ko":"데이나는 입장권 판매 수익의 절반을 자연재해로 집을 잃은 가족들에게 기부했다."},{"n":24,"en":"Dana kept Becky’s message framed in her office as a reminder that one kind gesture could change someone’s life.","ko":"데이나는 친절한 행동 하나가 누군가의 삶을 바꿀 수 있다는 것을 떠올리려고 베키의 글귀를 액자에 넣어 사무실에 두었다."},{"n":25,"en":"The kindness of one stranger had shaped her path, and she made sure it continued to shape the world.","ko":"낯선 사람 한 명의 친절이 데이나가 걸어온 길을 바꾸었고, 데이나는 그 친절이 계속 세상을 바꾸어 가도록 힘썼다."}],"topic":25,"gist":null,"hl":[{"sent":3,"text":"the sky had suddenly darkened"},{"sent":4,"text":"she had no umbrella"},{"sent":8,"text":"couldn’t find any stores nearby to buy an umbrella"},{"sent":17,"text":"Cover each other"},{"sent":20,"text":"her dream job
