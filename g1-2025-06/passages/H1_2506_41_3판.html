<script>window.DECK3={"meta":{"id":"H1_2506_41","grade":"고1","year":2025,"month":6,"item_no":41,"orig_type":"제목(장문)","words":217,"exam":"2025학년도 6월 전국연합학력평가 고1 영어","topic_ko":"신용 카드 결제가 손실감을 줄여 지출을 늘리는 현상","title_ko":"신용 카드는 돈을 내는 아픔을 무디게 한다","title_en":"Credit Cards Numb the Pain of Paying","gist_ko":"신용 카드로 돈을 내면 지불의 고통을 덜 느끼게 되어, 사람들은 지출을 줄이려 하지 않고 더 많은 돈을 쓴다."},"kind":"long","boards":[{"key":"topic","no":"①","name":"주제문","full":"① 주제문 판"},{"key":"gram","no":"②","name":"어법 · 어휘","full":"② 어법 · 어휘 판"},{"key":"all","no":"③","name":"전체","full":"③ 전체 판"}],"sents":[{"n":1,"en":"Paying with plastic fundamentally changes the way we spend money, altering the calculus of our financial decisions.","ko":"플라스틱 카드로 돈을 내면 돈을 쓰는 방식이 근본적으로 바뀌고, 금융 결정의 셈법도 달라진다."},{"n":2,"en":"When you buy something with cash, the purchase involves an actual loss — your wallet is literally lighter.","ko":"현금으로 사면 실제 손실이 따르고, 지갑이 말 그대로 가벼워진다."},{"n":3,"en":"Credit cards, however, make the purchase abstract, so that you don’t really feel the downside of spending money.","ko":"그러나 신용 카드는 구매를 추상적인 일로 만들어, 돈을 쓰는 일의 불리한 면을 정말로 느끼지 못하게 한다."},{"n":4,"en":"Brain-imaging experiments suggest that paying with credit cards actually reduces activity in the insula, a brain region associated with negative feelings.","ko":"뇌 영상 실험에 따르면, 신용 카드로 내면 부정적 감정과 관련된 뇌 부위인 뇌섬엽의 활동이 실제로 줄어든다."},{"n":5,"en":"As George Loewenstein, a neuroeconomist at Carnegie Mellon, says, “The nature of credit cards ensures that your brain is anesthetized against the pain of payment.”","ko":"카네기 멜론 대학교의 신경 경제학자 조지 로웬스타인은 “신용 카드의 본질 때문에 뇌는 지불의 고통에 무감각해진다.”라고 말한다."},{"n":6,"en":"Spending money doesn’t feel bad, so you spend more money.","ko":"돈을 써도 기분이 나쁘지 않으니 돈을 더 많이 쓰게 된다."},{"n":7,"en":"Consider this experiment: Drazen Prelec and Duncan Simester, two business professors at MIT, organized a real-life, sealed-bid auction for tickets to a Boston Celtics game.","ko":"이 실험을 보라. MIT 경영학 교수 드라젠 프렐렉과 던컨 시미스터는 보스턴 셀틱스 경기 입장권을 걸고 실제 비공개 입찰 경매를 열었다."},{"n":8,"en":"Half the participants in the auction were informed that they had to pay with cash; the other half were told they had to pay with credit cards.","ko":"참가자의 절반은 현금으로 내야 한다는 통보를 받았고, 나머지 절반은 신용 카드로 내야 한다는 말을 들었다."},{"n":9,"en":"Prelec and Simester then averaged the bids for the two different groups.","ko":"그다음 두 교수는 두 집단의 입찰가 평균을 냈다."},{"n":10,"en":"It turns out that the average credit card bid was twice as high as the average cash bid.","ko":"그 결과 신용 카드 평균 입찰가가 현금 평균 입찰가보다 두 배 높았다."},{"n":11,"en":"When people used their credit cards, their bids were much more reckless.","ko":"사람들은 신용 카드를 쓸 때 훨씬 더 무모하게 입찰했다."},{"n":12,"en":"They no longer felt the need to limit their expenses.","ko":"사람들은 더 이상 지출을 제한할 필요를 느끼지 않았다."}],"topic":1,"gist":null,"hl":[{"sent":1,"text":"fundamentally changes the way we spend money"},{"sent":2,"text":"an actual loss"},{"sent":3,"text":"you don’t really feel the downside of spending money"},{"sent":4,"text":"reduces activity in the insula"},{"sent":5,"text":"anesthetized against the pain of payment"},{"sent":6,"text":"so you spend more money"},{"sent":10,"text":"twice as high as the average cash bid"},{"sent":11,"text":"much more reckless"}],"con":[{"sent":3,"text":"however","rel":"역접"},{"sent":3,"text":"so that","rel":"결과"},{"sent":6,"text":"so","rel":"결과"},{"sent":9,"text":"then","rel":"시간"}],"ref":[{"sent":12,"text":"They","occ":0,"to_sent":11,"to":"people","ko":"신용 카드를 쓴 사람들"},{"sent":9,"text":"the two different groups","occ":0,"to_sent":8,"to":"Half the participants","ko":"현금으로 낸 집단과 신용 카드로 낸 집단"}],"grammar":[{"id":"g1","sent":1,"pos":0,"text":"Paying","cat":"동명사","chip":"동명사","right":"Paying","wrong":["Pay"],"rule":"문장의 주어로 쓰인 동명사이다.","imp":0,"deck":false},{"id":"g2","sent":1,"pos":34,"text":"changes","cat":"동사 수 일치","chip":"수일치","right":"changes","wrong":["change"],"rule":"동명사 주어는 단수로 받으므로 changes 를 쓴다.","imp":0,"deck":true},{"id":"g3","sent":1,"pos":66,"text":"altering","cat":"분사·분사구문","chip":"분사","right":"altering","wron
